<link rel="preload" href="fontes/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css?v=da03288c">
<script type="module" src="app.js?v=da03288c"></script>
</head>
<body>
<div class="palco">
  <header class="topo">
    <img class="marca" src="marca/logo-480.png" width="480" height="85" alt="Audácia">
    <button class="voltar" id="voltar" type="button" hidden>Voltar</button>
  </header>

  <!-- abertura -->
  <section class="tela tela-abertura" data-tela="abertura">
    <div class="ab-anel" aria-hidden="true"><i></i></div>
    <div class="abertura-corpo">
      <h1 class="abertura-titulo" id="abertura-titulo">Veja em 3 minutos onde a sua empresa está deixando <span class="acento">dinheiro na mesa</span><span class="pontuacao">.</span></h1>
      <div class="ornamento" aria-hidden="true"><i></i><span><b></b><b></b><b></b></span><i></i></div>
      <p class="abertura-apoio" id="abertura-apoio">Não é sobre marketing, não é sobre vendas, é sobre receita. Responda e descubra onde ela trava.</p>
    </div>
    <div class="abertura-pe">
      <button class="cta" id="comecar" type="button">
        <span class="cta-pista">
          <span class="cta-disco" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
          <span class="cta-txt" id="comecar-txt">Começar o diagnóstico</span>
          <span class="cta-brilho" aria-hidden="true"></span>
        </span>
      </button>
      <p class="abertura-linha" id="abertura-linha"><span>7 perguntas</span><b></b><span>3 minutos</span></p>
    </div>
  </section>

  <!-- pergunta -->
  <section class="tela tela-pergunta" data-tela="pergunta" hidden>
    <div class="pergunta-coluna">
      <div class="progresso" role="progressbar" aria-valuemin="0" aria-valuemax="7" aria-valuenow="1" aria-label="Progresso">
        <div class="progresso-txt"><span class="progresso-bloco" id="progresso-bloco"></span><span class="progresso-pct" id="progresso-pct">0%</span></div>
        <div class="progresso-trilho"><div class="progresso-barra" id="progresso-barra"></div></div>
      </div>
      <div class="pergunta" id="pergunta">
        <h2 class="pergunta-titulo" id="pergunta-titulo" tabindex="-1"></h2>
        <div class="opcoes" id="opcoes" role="radiogroup" aria-labelledby="pergunta-titulo"></div>
      </div>
    </div>
  </section>

  <!-- captura -->
  <section class="tela tela-captura" data-tela="captura" hidden>
    <div class="captura-cabeca">
      <div class="progresso progresso-cheio" aria-hidden="true">
        <div class="progresso-trilho"><div class="progresso-barra" style="width:100%"></div></div>
      </div>
      <div class="ornamento ornamento-cheio" aria-hidden="true"><i></i><span><b></b><b></b><b></b></span><i></i></div>
      <h2 class="captura-titulo" id="captura-titulo" tabindex="-1"></h2>
    </div>
    <form class="form" id="form" novalidate>
      <label class="campo"><span id="l-nome"></span>
        <input name="nome" id="f-nome" autocomplete="name" required maxlength="120"></label>
      <label class="campo"><span id="l-whatsapp"></span>
        <input name="whatsapp" id="f-whatsapp" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="(00) 00000-0000" required maxlength="16"></label>
      <label class="campo"><span id="l-empresa"></span>
        <input name="empresa" id="f-empresa" autocomplete="organization" required maxlength="120"></label>
      <label class="campo campo-lista"><span id="l-segmento"></span>
        <select name="segmento" id="f-segmento"><option value="">Escolha</option></select></label>
      <label class="campo" id="campo-outro" hidden><span id="l-segmento-outro"></span>
        <input name="segmento_outro" id="f-segmento-outro" maxlength="80"></label>
      <fieldset class="faixas"><legend id="l-faturamento"></legend><div id="f-faturamento"></div></fieldset>
      <label class="autoriza"><input type="checkbox" id="f-autoriza" required><span id="l-autoriza"></span></label>
      <p class="form-erro" id="form-erro" role="alert" hidden></p>
      <button class="cta" id="enviar" type="submit">
        <span class="cta-pista">
          <span class="cta-disco" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
          <span class="cta-txt" id="enviar-txt"></span>
          <span class="cta-brilho" aria-hidden="true"></span>
        </span>
      </button>
    </form>
  </section>

  <!-- resultado -->
  <section class="tela tela-resultado" data-tela="resultado" hidden>
    <div class="diagnostico">
      <div class="ornamento" aria-hidden="true"><i></i><span><b></b><b></b><b></b></span><i></i></div>
      <h2 class="diag-titulo" id="diag-titulo" tabindex="-1"></h2>
      <p class="diag-texto" id="diag-texto"></p>
    </div>
    <div class="resultado-notas">
      <p class="rotulo" id="r-rotulo-notas"></p>
      <div class="notas" id="notas"></div>
    </div>
    <div class="video" id="video" hidden></div>
  </section>
</div>
</body>
</html>
